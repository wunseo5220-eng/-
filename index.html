<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컴활 2급 필기 · 동물 마을 수업실</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{
  --sky1:#7fd0ff; --sky2:#e6f7ff; --card:#ffffff; --ink:#1f3a4d; --sub:#5b7586;
  --carrot:#ff8a3d; --line:#d7eaf5; --bg:#f4fbff; --ground:#4cb97a;
}
@media (prefers-color-scheme:dark){
  :root{--sky1:#16405f; --sky2:#10263a; --card:#183650; --ink:#eaf6ff; --sub:#a9c1d2; --line:#2b4b66; --bg:#0d2033; --ground:#2f7d55;}
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);line-height:1.5}
.sky{background:linear-gradient(var(--sky1),var(--sky2));padding:18px 16px 0;position:relative;overflow:hidden}
.sky::before{content:"☀️";position:absolute;right:6%;top:14px;font-size:40px}
.sky::after{content:"☁️      ☁️";position:absolute;left:5%;top:30px;font-size:30px;opacity:.85;white-space:pre}
.hero{max-width:760px;margin:0 auto;text-align:center;position:relative;z-index:1;padding-top:30px}
.sign{display:inline-block;background:var(--card);border:4px solid var(--carrot);border-radius:20px;padding:10px 26px;box-shadow:0 6px 0 var(--carrot)}
.sign h1{font-size:clamp(26px,6vw,38px);margin:0;font-weight:400}
.hero p{margin:14px 0 0;font-size:18px}
.crowd{font-size:38px;letter-spacing:4px;margin-top:10px}
.city{display:flex;align-items:flex-end;justify-content:center;gap:6px;max-width:760px;margin:10px auto 0}
.b{flex:1;border-radius:10px 10px 0 0;position:relative;min-width:0}
.b::after{content:"";position:absolute;inset:14px 22% 0;background:repeating-linear-gradient(#ffffff88 0 8px,transparent 8px 18px);border-radius:4px}
.b:nth-child(1){height:70px;background:#ffb27a}.b:nth-child(2){height:110px;background:#8fd8b0}
.b:nth-child(3){height:84px;background:#b9a6f5}.b:nth-child(4){height:130px;background:#ff9a9a}
.b:nth-child(5){height:96px;background:#ffd36e}.b:nth-child(6){height:72px;background:#7fc6f5}
.grass{height:16px;background:var(--ground)}
.wrap{max-width:760px;margin:0 auto;padding:26px 16px 56px}
.road{position:relative;padding-left:22px}
.road::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;border-left:5px dotted #ffb27a}
.zone{--c:var(--carrot);--t:#fff3e6;background:var(--card);border:3px solid var(--line);border-radius:24px;margin:0 0 16px;overflow:hidden;position:relative}
.zone::before{content:"";position:absolute;left:-22px;top:26px;width:18px;height:18px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 2px var(--c)}
.zone[open]{border-color:var(--c)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--t)}
summary::-webkit-details-marker{display:none}
summary:focus-visible,.btn:focus-visible{outline:3px solid var(--carrot);outline-offset:2px}
@media (prefers-color-scheme:dark){.zone{--t:#1f4260}}
.ico{font-size:34px;width:58px;height:58px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none;box-shadow:inset 0 -4px 0 #0002}
.zt{flex:1;min-width:0}
.zt b{display:block;font-size:22px;font-weight:400}
.zt span{color:var(--sub);font-size:15px}
.arrow{font-size:20px;color:var(--c);transition:transform .2s}
.zone[open] .arrow{transform:rotate(90deg)}
.list{padding:14px 16px 16px;display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border:2px dashed var(--line);border-radius:18px;padding:10px 12px}
.per{background:var(--c);color:#fff;border-radius:999px;padding:2px 12px;font-size:15px;flex:none}
.row .t{flex:1;min-width:150px;font-size:17px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;text-decoration:none;border-radius:999px;padding:5px 12px;border:2px solid var(--c);color:var(--ink);background:var(--t)}
a.btn:hover{background:var(--c);color:#fff}
.btn.off{border-color:var(--line);color:var(--sub);border-style:dashed;background:transparent}
footer{text-align:center;color:var(--sub);font-size:14px;margin-top:26px}
@media (prefers-reduced-motion:reduce){.arrow{transition:none}}

.qrbtn{position:absolute;right:14px;top:14px;z-index:3;font:inherit;font-size:16px;color:var(--carrot);background:var(--card);border:3px solid var(--carrot);border-radius:14px;padding:4px 14px;cursor:pointer;box-shadow:0 3px 0 var(--carrot)}
.qrbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
dialog{border:4px solid var(--carrot);border-radius:24px;background:var(--card);color:var(--ink);text-align:center;padding:20px 24px;font-family:inherit}
dialog::backdrop{background:#0006}
dialog svg{width:min(70vw,280px);height:auto;display:block;margin:10px auto;border-radius:12px;background:#fff}
dialog p{margin:4px 0 12px;color:var(--sub)}
.sky::before{right:84px}
</style>
</head>
<body>
<div class="sky">
  <button class="qrbtn" type="button" onclick="document.getElementById('qr').showModal()">QR</button>
  <header class="hero">
    <div class="sign"><h1>컴활 2급 필기 수업실</h1></div>
    <p>동물 마을에서 5주 동안 자격증 도전!</p>
    <div class="crowd" aria-hidden="true">🐰🦊🐘🦒🐭</div>
  </header>
  <div class="city" aria-hidden="true"><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div></div>
</div>
<div class="grass"></div>
<div class="wrap">
  <main id="zones" class="road"></main>
  <footer>자료는 매주 업데이트돼요 · 문의는 담당 선생님께</footer>
</div>

    { t:"엑셀 기초", files:[["학습지",""],["PPT",""]] },

  ]}
];

const root = document.getElementById("zones");
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
ZONES.forEach((z, zi) => {
  const d = document.createElement("details");
  d.className = "zone";
  d.style.setProperty("--c", z.c);
  if (!dark) d.style.setProperty("--t", z.t);
  if (zi === 0) d.open = true;
  const sum = document.createElement("summary");
  sum.innerHTML = '<div class="ico" aria-hidden="true"></div><div class="zt"><b></b><span></span></div><div class="arrow" aria-hidden="true">▶</div>';
  sum.querySelector(".ico").textContent = z.icon;
  sum.querySelector("b").textContent = z.name;
  sum.querySelector("span").textContent = z.sub;
  d.appendChild(sum);
  const list = document.createElement("div");
  list.className = "list";
  z.periods.forEach((p, pi) => {
    const row = document.createElement("div");
    row.className = "row";
    const per = document.createElement("span");
    per.className = "per";
    per.textContent = p.l || (z.periods.length === 1 ? "안내" : (pi + 1) + "교시");
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = p.t;
    const btns = document.createElement("div");
    btns.className = "btns";
    p.files.forEach(([label, url]) => {
      if (url) {
        const a = document.createElement("a");
        a.className = "btn"; a.href = url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = label;
        btns.appendChild(a);
      } else {
        const s = document.createElement("span");
        s.className = "btn off";
        s.textContent = label + " 준비 중";
        btns.appendChild(s);
      }
    });
    row.append(per, t, btns);
    list.appendChild(row);
  });
  d.appendChild(list);
  root.appendChild(d);
});
</script>
